[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"


[project]
name = "jarvislm"
version = "0.1.0"
description = "A small decoder-only language model built and trained from scratch."
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "datasets>=2.16.0",
    "wandb>=0.16.0",
    "tiktoken>=0.13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.1.0"]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
